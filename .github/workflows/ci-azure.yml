name: Deploy Titanic Django to Azure 
on:
  push:
    branches:
      - dev
      - feature/ci-azure

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Clean old Conda environment
        run: |
          conda env remove -n titanic-capstone-env || true
    
      - name: Set up Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          python-version: 3.12
          environment-file: environment.yml
          activate-environment: titanic-capstone-env
          use-mamba: true
          use-only-tar-bz2: False
          
      - name: Check Python and Django
        run: |
          python --version
          python -m pip show django
      
      - name: Copy ML model
        run: |
          mkdir -p web/ml_models
          cp models/titanic_model_LR.pkl web/ml_models/

      - name: Collect Django static files
        run: |
          cd web
          python manage.py collectstatic --noinput
          python manage.py migrate          

      # Deploy to Azure (only for dev)
      - name: Deploy to Azure Web App
        if: github.ref_name == 'dev'
        uses: azure/webapps-deploy@v2
        with:
          app-name: titanic-ml-app
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: web
